name: Build & Push Image

# 触发：推 main/master、打 v* 标签、或手动点 Run workflow
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 多架构：群晖/威联通 x86 机器用 amd64，ARM 机型（如 DS223）用 arm64
  # 只需要 x86 的话删掉 ",linux/arm64" 可省一半构建时间
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # 推送 GHCR 必需

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # GHCR 的镜像名不允许大写，GitHub 用户名有大小写时必须转换。
      # 镜像名固定为 <owner>/cmcc-workbench，与仓库名解耦，
      # 这样 NAS 上的 .env 只需替换用户名部分即可。
      - name: 计算镜像名
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/cmcc-workbench" >> "$GITHUB_ENV"
          echo "镜像地址：${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/cmcc-workbench"

      - name: 启用 QEMU（arm64 模拟）
        uses: docker/setup-qemu-action@v3

      - name: 启用 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # pip 源可换成国内镜像加速：https://pypi.tuna.tsinghua.edu.cn/simple
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像地址
        run: |
          echo "### 构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
